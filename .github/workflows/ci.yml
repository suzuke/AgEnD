name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt, clippy).
      - run: rustup toolchain install
      # No-std target for the agend-core structural check in `cargo xtask check-deps`.
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo build -p agend -p agend-testkit --bins
      - run: python3 -B scripts/verify_smoke_contract.py --agend target/debug/agend
      - run: cargo test --workspace
      - run: cargo xtask check-deps
