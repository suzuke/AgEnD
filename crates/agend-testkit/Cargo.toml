[package]
name = "agend-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agend-core.workspace = true
# PTY bytes of the fake daemon's terminal (`terminal_bytes`, `terminal_input`).
base64 = "0.22"
serde_json = "1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
# C contracts consume the real parser; never a normal testkit dependency.
agend-holder.workspace = true
# Lowers the test process's own descriptor limit (tests/out_of_descriptors.rs).
libc = "0.2"
