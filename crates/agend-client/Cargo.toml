[package]
name = "agend-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agend-core.workspace = true
# PTY bytes are base64 on the wire; the adapter owns the encoding (gate 11 B).
base64 = "0.22"
serde_json = "1"
serde = { version = "1", default-features = false, features = ["alloc"] }
# Deadline-bounded Unix connect without a background thread or unsafe code.
socket2 = "0.6"

[dev-dependencies]
agend-testkit.workspace = true
# Consumer frame tests use the real holder parser; not a runtime dependency.
agend-holder.workspace = true
