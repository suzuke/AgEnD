[package]
name = "agend-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agend-core.workspace = true
# flock probes of holder lock files (gate 4 P3).
libc = "0.2"
# SQLite compiled into the binary (gate 5 P1): one version on every platform,
# with STRICT tables and VACUUM INTO.
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
# The daemon's one multi-thread runtime (gate 6): channels to the store
# thread (gate 5 P1), spawn_blocking for holder protocol calls, timers,
# SIGINT/SIGTERM; the client socket server (gate 8: net, io-util, macros).
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"
# The codex driver's JSON-RPC over WebSocket to `codex app-server` (gate 7
# P1): blocking I/O, one std thread per instance link.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
agend-testkit.workspace = true
sha2 = "0.10"
