# agend-core is pure logic: no processes, sockets, filesystem, env, or threads.
# Enforced by `cargo clippy -- -D warnings` (clippy reads this file from the
# crate's manifest directory). Type-resolved, so import style and aliases
# (`use std as s;`, grouped/multi-line imports) cannot bypass it.
disallowed-types = [
    { path = "std::process::Command", reason = "agend-core must not spawn processes" },
    { path = "std::process::Child", reason = "agend-core must not spawn processes" },
    { path = "std::net::TcpStream", reason = "agend-core must not do network I/O" },
    { path = "std::net::TcpListener", reason = "agend-core must not do network I/O" },
    { path = "std::net::UdpSocket", reason = "agend-core must not do network I/O" },
    { path = "std::os::unix::net::UnixStream", reason = "agend-core must not do socket I/O" },
    { path = "std::os::unix::net::UnixListener", reason = "agend-core must not do socket I/O" },
    { path = "std::os::unix::net::UnixDatagram", reason = "agend-core must not do socket I/O" },
    { path = "std::fs::File", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::OpenOptions", reason = "agend-core must not do filesystem I/O" },
]
disallowed-methods = [
    { path = "std::process::Command::new", reason = "agend-core must not spawn processes" },
    { path = "std::fs::read", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::read_to_string", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::write", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::read_dir", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::remove_file", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::remove_dir", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::remove_dir_all", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::create_dir", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::create_dir_all", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::rename", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::copy", reason = "agend-core must not do filesystem I/O" },
    { path = "std::fs::metadata", reason = "agend-core must not do filesystem I/O" },
    { path = "std::env::var", reason = "agend-core must not read the environment; callers pass values in" },
    { path = "std::env::var_os", reason = "agend-core must not read the environment; callers pass values in" },
    { path = "std::env::vars", reason = "agend-core must not read the environment; callers pass values in" },
    { path = "std::thread::spawn", reason = "agend-core is synchronous pure logic" },
]
